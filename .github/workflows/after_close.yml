name: MTT after-close desk snapshot
on:
  schedule:
    # 15:55 IST = 10:25 UTC, weekdays; exchange holidays need calendar check.
    - cron: '25 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtt-desk
  cancel-in-progress: false
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build after-close snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          MTT_DESK_WATCHLIST: ${{ vars.MTT_DESK_WATCHLIST }}
        run: python daily_job.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Update after-close desk snapshot"
            git push
          fi
