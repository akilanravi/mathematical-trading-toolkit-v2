name: Next-Day Desk Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: next-day-desk
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Dhan credentials
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          test -n "$DHAN_CLIENT_ID" || { echo '::error::DHAN_CLIENT_ID missing'; exit 1; }
          test -n "$DHAN_ACCESS_TOKEN" || { echo '::error::DHAN_ACCESS_TOKEN missing'; exit 1; }
      - name: Generate after-close snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python next_day_engine.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('snapshots/next_day.json')
          if not p.is_file(): raise SystemExit('Snapshot missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(d, dict) or not isinstance(d.get('scanned'), int) or d['scanned'] <= 0:
              raise SystemExit('Invalid snapshot: missing or zero scanned count')
          print('Snapshot validated: scanned', d['scanned'], 'eligible', d.get('eligible'))
          PY
      - name: Commit snapshot with safe push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp snapshots/next_day.json "$RUNNER_TEMP/next_day.json"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p snapshots
            cp "$RUNNER_TEMP/next_day.json" snapshots/next_day.json
            git add snapshots/next_day.json
            if git diff --cached --quiet; then
              echo 'Snapshot already up to date.'
              exit 0
            fi
            git commit -m 'Update after-close next-day watchlist'
            if git push origin HEAD:main; then
              echo 'Snapshot published successfully.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error::Could not push snapshot after five attempts.'
          exit 1
